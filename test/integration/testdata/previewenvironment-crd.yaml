# Stub PreviewEnvironment CRD for the vesperctl integration tests.
#
# Same group, version and names as the real CRD planned in #28 and #29, but
# without validation: spec and status keep any field, and status is not a
# subresource, so the tests create objects with their status in one request,
# as if a controller had already set it.
#
# Replace it with the generated CRD once the operator defines the API.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: previewenvironments.vesper.eventide.dev
  labels:
    app.kubernetes.io/managed-by: vesper-integration-tests
spec:
  group: vesper.eventide.dev
  scope: Namespaced
  names:
    kind: PreviewEnvironment
    listKind: PreviewEnvironmentList
    plural: previewenvironments
    singular: previewenvironment
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
