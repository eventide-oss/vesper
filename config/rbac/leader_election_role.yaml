# Permissions for leader election: when several replicas of the operator run,
# one of them holds a Lease and works, the others wait. Holding the Lease
# only needs get, create (the first time) and update (to take or renew it).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: vesper
    app.kubernetes.io/managed-by: kustomize
  name: leader-election-role
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - create
  - update
# The leader election records an event when the leader changes.
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
