---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - get
  - list
  - update
  - watch
- apiGroups:
  - vesper.eventide.dev
  resources:
  - previewenvironments
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - vesper.eventide.dev
  resources:
  - previewenvironments/status
  verbs:
  - get
  - patch
