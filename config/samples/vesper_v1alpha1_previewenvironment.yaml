apiVersion: vesper.eventide.dev/v1alpha1
kind: PreviewEnvironment
metadata:
  labels:
    app.kubernetes.io/name: vesper
    app.kubernetes.io/managed-by: kustomize
  name: previewenvironment-sample
spec:
  # Pinned with a tag (not latest) or a digest. Required.
  image: nginxinc/nginx-unprivileged:1.27
  # Optional fields, shown with their defaults.
  port: 8080
  replicas: 1
  ttl: 24h
  env:
    - name: LOG_LEVEL
      value: info
