---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: previewsources.vesper.eventide.dev
spec:
  group: vesper.eventide.dev
  names:
    kind: PreviewSource
    listKind: PreviewSourceList
    plural: previewsources
    singular: previewsource
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.repository
      name: Repository
      type: string
    - jsonPath: .spec.trigger
      name: Trigger
      type: string
    - jsonPath: .spec.namespace
      name: Namespace
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .spec.image
      name: Image
      priority: 1
      type: string
    - jsonPath: .spec.forkPullRequests
      name: Forks
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PreviewSource allows a GitHub repository to have previews of its pull
          requests. It is cluster-scoped: an administrator of the cluster creates
          it, not the teams, since it lets a repository run code on the cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the repository and the settings of its previews
            properties:
              buildWorkflow:
                description: |-
                  buildWorkflow is the file name of the GitHub Actions workflow that
                  builds the image, for example preview.yml: a preview switches to the
                  image of a commit once a run of this workflow succeeds on it. Empty
                  when the image is pushed before the pull request event.
                maxLength: 100
                pattern: ^[A-Za-z0-9._-]+[.]ya?ml$
                type: string
              defaults:
                default: {}
                description: defaults are the settings of the previews of this source.
                properties:
                  env:
                    description: |-
                      env are environment variables given to each preview. Their values are
                      readable by anyone who can read this source: no secrets.
                    items:
                      description: EnvVar is an environment variable set in the preview's
                        container.
                      properties:
                        name:
                          description: name of the variable, for example LOG_LEVEL.
                          maxLength: 256
                          minLength: 1
                          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                          type: string
                        value:
                          description: value of the variable. Empty by default.
                          maxLength: 4096
                          type: string
                      required:
                      - name
                      type: object
                    maxItems: 64
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  port:
                    default: 8080
                    description: port is the port the application listens on, inside
                      its container.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  replicas:
                    default: 1
                    description: replicas is the number of pods of each preview.
                    format: int32
                    maximum: 5
                    minimum: 1
                    type: integer
                  ttl:
                    default: 24h
                    description: |-
                      ttl is how long a preview lives after the last commit of its pull
                      request, from 1m to 168h.
                    type: string
                    x-kubernetes-validations:
                    - message: ttl must be a duration such as 24h or 90m, between
                        1m and 168h
                      rule: self.matches('^([0-9]+([.][0-9]+)?(h|m|s))+$') && duration(self)
                        >= duration('1m') && duration(self) <= duration('168h')
                type: object
              forkPullRequests:
                default: Deny
                description: |-
                  forkPullRequests chooses whether pull requests from forks get a
                  preview: Deny, never; RequireLabel, once someone with write access to
                  the repository adds the label preview. Their code is not reviewed.
                enum:
                - Deny
                - RequireLabel
                type: string
              image:
                description: |-
                  image is the image of a pull request, as a template: {{number}} is
                  replaced by the number of the pull request, and {{sha}} by its head
                  commit, for example ghcr.io/acme/app:pr-{{number}}-{{sha}}. It must
                  contain {{sha}}, so that each commit has an image of its own, and give
                  a valid image reference pinned with a tag other than latest.
                maxLength: 512
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: image must contain {{sha}}, so that each commit has an
                    image of its own
                  rule: self.contains('{{sha}}')
                - message: image must give a valid image reference with a tag, in
                    lowercase, such as ghcr.io/acme/app:pr-{{number}}-{{sha}}; {{number}}
                    and {{sha}} are the only placeholders
                  rule: self.replace('{{number}}', '1').replace('{{sha}}', '0123456789abcdef0123456789abcdef01234567').matches('^([a-z0-9]([a-z0-9-]*[a-z0-9])?([.][a-z0-9]([a-z0-9-]*[a-z0-9])?)*(:[0-9]+)?/)?[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*(/[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*)*:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$')
                - message: image must not use the tag latest
                  rule: '!self.endsWith('':latest'')'
              namespace:
                description: |-
                  namespace is where the PreviewEnvironment objects of this source are
                  created. Each of them still runs in a namespace of its own.
                maxLength: 63
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              repository:
                description: |-
                  repository is the GitHub repository, as <owner>/<name>, for example
                  acme/app. GitHub compares it without case.
                maxLength: 140
                pattern: ^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?/[A-Za-z0-9._-]{1,100}$
                type: string
                x-kubernetes-validations:
                - message: repository must be <owner>/<name>, and the name cannot
                    be . or ..
                  rule: '!self.endsWith(''/.'') && !self.endsWith(''/..'')'
              trigger:
                default: All
                description: |-
                  trigger chooses which pull requests get a preview: All, every pull
                  request, and the label no-preview stops one; Label, only the pull
                  requests with the label preview.
                enum:
                - All
                - Label
                type: string
            required:
            - image
            - namespace
            - repository
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'name must be at most 40 lowercase letters, digits and hyphens:
            the previews of the source are named <name>-pr-<number>'
          rule: self.metadata.name.size() <= 40 && self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    served: true
    storage: true
    subresources: {}
