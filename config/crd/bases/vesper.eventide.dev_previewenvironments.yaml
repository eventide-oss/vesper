---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: previewenvironments.vesper.eventide.dev
spec:
  group: vesper.eventide.dev
  names:
    kind: PreviewEnvironment
    listKind: PreviewEnvironmentList
    plural: previewenvironments
    singular: previewenvironment
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PreviewEnvironment is the Schema for the previewenvironments
          API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of PreviewEnvironment
            properties:
              env:
                description: |-
                  env sets environment variables in the container. Names are unique.
                  Values are stored in plain text in the object: do not put secrets here.
                items:
                  description: EnvVar is an environment variable set in the preview's
                    container.
                  properties:
                    name:
                      description: name of the variable, for example LOG_LEVEL.
                      maxLength: 256
                      minLength: 1
                      pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                      type: string
                    value:
                      description: value of the variable. Empty by default.
                      maxLength: 4096
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              image:
                description: |-
                  image is the container image to run, pinned with a tag other than
                  "latest" or with a digest, for example ghcr.io/acme/app:pr-42 or
                  ghcr.io/acme/app@sha256:<64 hex characters>. A preview must show exactly
                  the code it was created for, and a moving tag would not.
                maxLength: 512
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: image must be a valid image reference in lowercase, such
                    as ghcr.io/acme/app:pr-42
                  rule: self.matches('^([a-z0-9]([a-z0-9-]*[a-z0-9])?([.][a-z0-9]([a-z0-9-]*[a-z0-9])?)*(:[0-9]+)?/)?[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*(/[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*)*(:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127})?(@sha256:[a-f0-9]{64})?$')
                - message: image must be pinned with a tag other than latest, or with
                    a digest
                  rule: self.matches('@sha256:[a-f0-9]{64}$') || (self.matches(':[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$')
                    && !self.endsWith(':latest'))
              port:
                default: 8080
                description: port is the port the container listens on. Defaults to
                  8080.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              replicas:
                default: 1
                description: replicas is the number of pods to run. Defaults to 1,
                  at most 5.
                format: int32
                maximum: 5
                minimum: 1
                type: integer
              ttl:
                default: 24h
                description: |-
                  ttl is how long the preview lives after its creation, as a duration such
                  as "24h" or "90m", between 1h and 168h (7 days). Defaults to 24h.
                type: string
                x-kubernetes-validations:
                - message: ttl must be a duration such as 24h or 90m, between 1h and
                    168h
                  rule: self.matches('^([0-9]+([.][0-9]+)?(h|m|s))+$') && duration(self)
                    >= duration('1h') && duration(self) <= duration('168h')
            required:
            - image
            type: object
          status:
            description: status defines the observed state of PreviewEnvironment
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the PreviewEnvironment resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
