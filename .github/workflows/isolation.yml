# Checks the network isolation of previews with the CNI plugins most clusters
# run (#167): each plugin enforces a NetworkPolicy in its own way. The e2e job
# of CI checks it with kindnet on every pull request; this one adds Calico and
# Cilium when the isolation may change, every week to catch a new behavior of
# the plugins, and on demand, before a release.
name: Isolation

on:
  pull_request:
    paths:
      - internal/controller/networkpolicy.go
      - internal/controller/hostaddresses.go
      - test/e2e/network_test.go
      - hack/test-e2e.sh
      - .github/workflows/isolation.yml
  push:
    branches: [main]
    paths:
      - internal/controller/networkpolicy.go
      - internal/controller/hostaddresses.go
      - test/e2e/network_test.go
      - hack/test-e2e.sh
      - .github/workflows/isolation.yml
  schedule:
    - cron: "17 4 * * 1" # Mondays at 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  isolation:
    name: isolation (${{ matrix.cni }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        cni: [calico, cilium]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Same pinned kind as the e2e job. helm, needed for Cilium, is on the
      # runner image.
      - run: go install sigs.k8s.io/kind@v0.33.0
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # The versions of Calico and Cilium are pinned in hack/test-e2e.sh.
      - run: make test-e2e
        env:
          E2E_CNI: ${{ matrix.cni }}
          E2E_RUN: TestPreviewNetworkIsolation
          E2E_ARTIFACTS_DIR: _artifacts/isolation-${{ matrix.cni }}
      # The logs are public, like the repository: the cluster holds no secret.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolation-${{ matrix.cni }}-logs
          path: _artifacts/isolation-${{ matrix.cni }}
          retention-days: 7
          if-no-files-found: ignore
