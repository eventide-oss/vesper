name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default. Raise it per job only if a job needs more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vet:
    name: vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make test
      # The coverage of the lifecycle code, in the log and on the summary page
      # of the run. It is reported, not enforced.
      - name: coverage report
        run: |
          make --no-print-directory cover | tee cover.txt
          {
            echo '### Test coverage of the lifecycle code'
            echo '```'
            cat cover.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  # The CRD, the RBAC role and the DeepCopy methods are generated from the Go
  # types and markers, with the pinned controller-gen of the Makefile.
  generated:
    name: generated
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make verify-generated

  vulncheck:
    name: vulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Pinned version: the module checksum is verified by the Go checksum database.
      # Bump it together with go.mod: recent releases require a recent Go.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Pinned version, verified by the Go checksum database. Keep it in line
      # with docs/development.md and the node image in hack/kind-config.yaml.
      - run: go install sigs.k8s.io/kind@v0.33.0
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # The runner has Docker. The cluster is discarded with the runner.
      - run: make test-integration

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Same pinned kind as the integration job.
      - run: go install sigs.k8s.io/kind@v0.33.0
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # Builds the operator image and vesperctl, deploys the operator in a fresh
      # kind cluster and runs the life of previews. On failure it prints the
      # operator logs and saves the logs of the cluster to _artifacts/e2e.
      - run: make test-e2e
      # The logs are public, like the repository: the e2e cluster holds no
      # secret.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: _artifacts/e2e
          retention-days: 7
          if-no-files-found: ignore
