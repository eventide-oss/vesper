name: Release

# Runs when a maintainer pushes a version tag, such as v0.1.0 or v0.1.0-rc.1.
# It builds the release assets, creates a draft release with them, and
# attests their provenance. A maintainer reads the draft and publishes it.
# See docs/release.md.
on:
  push:
    tags: ["v*"]

# Read-only by default; the release job raises what it needs.
permissions:
  contents: read

# Never two runs for the same tag at once, and never cancel a release halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the draft release and upload its assets
      id-token: write # get the OIDC identity that signs the attestation
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history and the tags: GoReleaser writes the notes from
          # the commits since the previous tag.
          fetch-depth: 0
      - name: check that the tag points to a commit of main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points to a commit that is not on main: release from main only"
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: read the GoReleaser version
        id: goreleaser
        run: echo "version=$(make --no-print-directory goreleaser-version)" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ steps.goreleaser.outputs.version }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Signed with the OIDC identity of this workflow run: anyone can check
      # that an archive was built here, from this tag, with
      # `gh attestation verify <archive> --repo <owner>/<repo>`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/release/checksums.txt
