name: Release

# Runs when a maintainer pushes a version tag, such as v0.1.0 or v0.1.0-rc.1.
# The image job publishes the operator image; the release job then builds
# the other assets, among them install.yaml with that image pinned by digest,
# and creates a draft release. Every asset gets a provenance attestation. A
# maintainer reads the draft and publishes it. See docs/release.md.
on:
  push:
    tags: ["v*"]

# Read-only by default; each job raises what it needs.
permissions:
  contents: read

# Never two runs for the same tag at once, and never cancel a release halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # get the OIDC identity that signs the attestation
      attestations: write # store the provenance attestation
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: check that the tag points to a commit of main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points to a commit that is not on main: release from main only"
            exit 1
          fi
      # Image names are lowercase; the repository name may not be.
      - name: name the image
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Both architectures from one build: the Dockerfile compiles on the
      # runner and cross-compiles, so arm64 needs no emulation. Only the
      # exact version tag: no `latest`. The source label links the package
      # to this repository. The provenance is the attestation below, so
      # BuildKit adds none of its own.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.ref_name }}
          build-args: VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.title=vesper
            org.opencontainers.image.description=Kubernetes operator for ephemeral preview environments
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: false
          sbom: false
      # Stored in the registry, next to the image:
      # `gh attestation verify oci://<image>@<digest> --repo <owner>/<repo>`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    name: release
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the draft release and upload its assets
      id-token: write # get the OIDC identity that signs the attestation
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history and the tags: GoReleaser writes the notes from
          # the commits since the previous tag.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # install.yaml names the image by its tag and its digest: what is
      # installed is the image built above, even if the tag moves.
      - name: write install.yaml
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          make build-installer IMG="$IMAGE:$GITHUB_REF_NAME@$DIGEST"
          grep -F "image: $IMAGE:$GITHUB_REF_NAME@$DIGEST" dist/install.yaml
      - name: read the GoReleaser version
        id: goreleaser
        run: echo "version=$(make --no-print-directory goreleaser-version)" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ steps.goreleaser.outputs.version }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Every file listed in checksums.txt: the archives and install.yaml.
      # Signed with the OIDC identity of this workflow run:
      # `gh attestation verify <file> --repo <owner>/<repo>`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/release/checksums.txt
