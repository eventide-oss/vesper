# GoReleaser builds the release assets of vesperctl: one archive per platform
# and a file of SHA-256 checksums. `make release-snapshot` runs it locally
# without publishing anything. See docs/development.md.
version: 2

project_name: vesperctl

# Not dist/: `make build-installer` writes dist/install.yaml, and GoReleaser
# empties its output directory on every run.
dist: dist/release

builds:
  - id: vesperctl
    main: ./cmd/vesperctl
    binary: vesperctl
    env:
      # A static binary that needs no C library from the system.
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      # Remove the paths of the build machine from the binary.
      - -trimpath
    ldflags:
      # -s -w drop the debug tables; -X sets the version vesperctl prints.
      - -s -w -X main.version=v{{ .Version }}
    # Files in the archives get the date of the commit, not the time of the
    # build, so that the same commit gives the same archives.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: vesperctl
    ids: [vesperctl]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Fixed owner and dates: the archives do not depend on who builds them,
    # or when.
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info: &file-info
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info: *file-info

checksum:
  name_template: checksums.txt
  algorithm: sha256
  # The install bundles, written by `make build-installer` with the image of
  # the release, pinned by digest: the operator, and vesper-github.
  extra_files:
    - glob: dist/install.yaml
    - glob: dist/install-github.yaml

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

# Release notes, from the titles of the commits since the previous tag: the
# squash-merge titles of pull requests, in Conventional Commits. A commit goes
# to the first group it matches.
changelog:
  use: github
  sort: asc
  # The title links to its pull request (#n); no commit hash, and the GitHub
  # login of the author, never an email address.
  format: "{{ .Message }}{{ with .AuthorUsername }} (@{{ . }}){{ end }}"
  groups:
    - title: Breaking changes
      regexp: '^\w+(\([^)]+\))?!:'
      order: 0
    - title: Features
      regexp: '^feat(\([^)]+\))?:'
      order: 1
    - title: Bug fixes
      regexp: '^fix(\([^)]+\))?:'
      order: 2
    - title: Other changes
      order: 999

# The release workflow (.github/workflows/release.yml) creates a draft: a
# maintainer reads it and publishes it. A tag such as v0.1.0-rc.1 makes a
# pre-release.
release:
  draft: true
  replace_existing_draft: true
  prerelease: auto
  name_template: "Vesper v{{ .Version }}"
  extra_files:
    - glob: dist/install.yaml
    - glob: dist/install-github.yaml
  footer: |
    ## Verify the downloads

    ```sh
    shasum -a 256 --check --ignore-missing checksums.txt
    gh attestation verify vesperctl_{{ .Version }}_linux_amd64.tar.gz --repo eventide-oss/vesper
    ```

    The second command checks that the archive was built from this
    repository by its release workflow. See docs/release.md.
